# Xcode project for the app + WidgetKit extension.
# Generate with: xcodegen generate   (the .xcodeproj itself is not committed)
#
# The plain ./build.sh path still works and needs no Xcode - it builds the
# menu bar app alone, without the widget. Use it for quick iteration.
name: ClaudeX
options:
  bundleIdPrefix: me.andrey
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# The team id lives in Team.xcconfig - change it there, not here.
configFiles:
  Debug: Team.xcconfig
  Release: Team.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  ClaudeX:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/App
    dependencies:
      - target: ClaudeXWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.andrey.ClaudeX
        PRODUCT_NAME: ClaudeX
        CODE_SIGN_ENTITLEMENTS: Resources/ClaudeX.entitlements
        INFOPLIST_FILE: Resources/ClaudeX-Info.plist

  ClaudeXWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.andrey.ClaudeX.widget
        PRODUCT_NAME: ClaudeXWidget
        CODE_SIGN_ENTITLEMENTS: Resources/ClaudeXWidget.entitlements
        INFOPLIST_FILE: Resources/ClaudeXWidget-Info.plist
        # Models.swift compiles the fetching-layer error type out of the widget.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_TARGET
